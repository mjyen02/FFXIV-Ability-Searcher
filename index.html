<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIV Job Abilty Searcher</title>
    <script type="module" src="main.js" defer></script>
    <link href="style.css" rel="stylesheet">
  </head>
<body class = "dark-mode">
  <h1>XIV Job Ability Searcher</h1>
  <button id="darkMode">Light Mode</button>

  <div class="wrapper">

    <div class="controls">
      <form>
        <p>
          <label for="jobSelect">Choose a Job (Optional):</label>
          <select name = "categories" id="jobSelect">
            <option value="all">All</option>
          </select>
        </p>
        <p>
          <label for="search" id="searchLabel">Enter a SINGLE search term (required if no Job selected): </label>
          <input type="text" id="search" class="search" required>
        </p>
        <p>
          <label for="category">Select a Mode: </label>
          <select name = "categories" id="modeSelector">
            <option value="pve">PvE</option>
            <option value="pvp">PvP</option>
            <option value="all">All</option>
          </select>
        </p>
        <P>
          <label for="category">Select a Category: </label>
          <select name = "categories" id="category">
            <option value="Action">Action</option>
            <option value="Trait">Trait</option>
          </select>
        </p>
        <p>
            <label for="category">Pick a Level Range (Optional):</label>
            <input type="number" id="lowLevel" class="search" min="1" max="100" placeholder="Min">
            -
            <input type="number" id="highLevel" class="search" min="1" max="100" placeholder="Max">
        </p>
        <!-- <p>
          <label for="end-date">Enter an end date (format YYYYMMDD): </label>
          <input type="date" id="end-date" class="end-date" pattern="[0-9]{8}">
        </p> -->
        <p>
          <button class="submit">Submit search</button>
        </p>
      </form>
    </div>

    <div class="results">
      <nav>
        <button class="prev">Previous</button>
        <button class="next">Next</button>
      </nav>

      <section>
      </section>
    </div>

  </div>

</body>
</html>
